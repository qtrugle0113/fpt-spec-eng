[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aat-etl-engine"
version = "0.1.0"
description = "ETL engine dùng chung, độc lập HTTP và orchestration"
requires-python = ">=3.12"
dependencies = [
  "aat-metadata==0.1.0",
  "pydantic==2.13.5",
  "SQLAlchemy==2.0.52",
  "psycopg[binary]==3.3.5",
  "PyMySQL==1.1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aat_etl", "aat_etl.*"]
namespaces = false

[tool.setuptools.package-data]
aat_etl = ["py.typed"]
