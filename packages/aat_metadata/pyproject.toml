[build-system]
requires = ["setuptools==84.2.1", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aat-metadata"
version = "0.1.0"
description = "Metadata dùng chung giữa backend và ETL runtime"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy==2.0.52", "cryptography==50.0.1", "psycopg[binary]==3.3.5"]

[tool.setuptools]
package-dir = {aat_metadata = "."}

[tool.setuptools.packages.find]
where = [".."]
include = ["aat_metadata", "aat_metadata.*"]
namespaces = false

[tool.setuptools.package-data]
aat_metadata = ["py.typed"]
