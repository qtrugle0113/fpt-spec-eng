[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aat-api"
version = "0.1.0"
description = "API của Airflow Automation Tool"
requires-python = ">=3.12"
dependencies = [
  "aat-metadata==0.1.0",
  "aat-etl-engine==0.1.0",
  "fastapi==0.136.3",
  "uvicorn==0.38.0",
  "pydantic==2.13.5",
  "SQLAlchemy==2.0.52",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.5",
  "PyMySQL==1.1.3",
  "cryptography==50.0.1",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aat_api", "aat_api.*"]
namespaces = false

[tool.setuptools.package-data]
aat_api = ["py.typed", "airflow_client/*.json"]
