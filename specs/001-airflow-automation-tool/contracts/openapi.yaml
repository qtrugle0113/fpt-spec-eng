      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: max_rows
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
      - name: parser_json
        in: query
        description: Cấu hình dự kiến chỉ preview, không persist hoặc đổi revision.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParserConfig'
  /files/{id}/validate:
    post:
      operationId: post_files_id_validate
      summary: Kiểm tra toàn file
      responses:
        '202':
          description: Đã tiếp nhận
          content:
            application/json:
