      - url: http://backend:8000
      security:
      - RuntimeBearer: []
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    From:
      name: from
      in: query
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      schema: {type: string, format: date-time}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
  responses:
    SafeError:
      description: Lỗi chuẩn hóa tiếng Anh, không secret
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Issue:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          enum:
          - workbook
          - sheet
          - cell
          - resource
        code:
          type: string
        message:
          type: string
        sheet:
          type:
          - string
          - 'null'
        row:
          type:
          - integer
          - 'null'
        column:
          type:
          - integer
          - 'null'
        column_name:
          type:
          - string
          - 'null'
      required:
      - scope
      - code
      - message
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            request_id: &id010
              type: string
              format: uuid
            retryable: &id011
              type: boolean
            operation_id:
              type:
              - string
              - 'null'
            details:
              type: array
              items:
                $ref: '#/components/schemas/Issue'
          required:
          - code
          - message
          - request_id
          - retryable
      required:
      - error
    ConnectionCreate:
      type: object
      additionalProperties: false
      properties:
        code: &id001
          type: string
          minLength: 1
          maxLength: 64
        name: &id002
          type: string
          minLength: 1
        database_type: &id003
          type: string
          enum:
          - POSTGRESQL
          - MYSQL
        host: &id004
          type: string
          minLength: 1
        port: &id005
          type: integer
          minimum: 1
          maximum: 65535
        database_name: &id006
          type: string
          minLength: 1
        schema_name: &id007
          type:
          - string
          - 'null'
        username: &id008
          type: string
        description: &id009
          type:
          - string
          - 'null'
        password:
          type: string
          writeOnly: true
      required:
      - code
      - name
      - database_type
      - host
      - port
      - database_name
      - username
    ConnectionPatch:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        name: *id002
        database_type: *id003
        host: *id004
        port: *id005
        database_name: *id006
        schema_name: *id007
        username: *id008
        description: *id009
        password:
          type: string
          writeOnly: true
      required: []
    Connection:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        name: *id002
        database_type: *id003
        host: *id004
        port: *id005
        database_name: *id006
        schema_name: *id007
        username: *id008
        description: *id009
        id: *id010
        revision:
          type: integer
          minimum: 1
        has_password: *id011
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DependencyRef'
        needs_revalidation:
          type: boolean
        test_status:
          type: string
          enum:
          - UNTESTED
          - SUCCESS
          - FAILED
        tested_at:
          type:
          - string
          - 'null'
        created_at: &id012
          type: string
          format: date-time
        updated_at: *id012
      required:
      - id
      - code
      - database_type
      - revision
      - has_password
      - dependencies
      - needs_revalidation
    TestResult:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - FAILED
        tested_at: *id012
        latency_ms:
          type: integer
          minimum: 0
        error:
          anyOf:
          - $ref: '#/components/schemas/Issue'
          - type: 'null'
      required:
      - status
      - tested_at
    ParserConfig:
      type: object
      additionalProperties: false
      properties:
        encoding:
          type: string
          default: utf-8
        delimiter:
          type: string
          minLength: 1
          maxLength: 1
        header_present: *id011
        quote_character:
          type: string
          minLength: 1
          maxLength: 1
        escape_character:
          type:
          - string
          - 'null'
        null_representation:
          type: string
      required:
      - encoding
      - delimiter
      - header_present
      - quote_character
      - null_representation
    File:
      type: object
      additionalProperties: false
      properties:
        id: *id010
        file_name:
          type: string
        file_type:
          type: string
          enum:
          - CSV
          - TXT
        size:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        parser:
          $ref: '#/components/schemas/ParserConfig'
        parser_revision:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        needs_revalidation:
          type: boolean
        validation_status:
          type: string
          enum:
          - PENDING
          - VALID
          - INVALID
        uploaded_at: *id012
        expires_at:
          type:
          - string
          - 'null'
      required:
      - id
      - file_name
      - file_type
      - size
      - sha256
      - parser
      - parser_revision
      - revision
      - needs_revalidation
    DefinitionUpload:
      type: object
      additionalProperties: false
      properties:
        id: *id010
        kind:
          type: string
          enum:
          - TABLE
          - ETL
        sha256:
          type: string
        template_version:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - UPLOADED
          - VALIDATING
          - VALIDATED
          - INVALID
        created_at: *id012
      required:
      - id
      - kind
      - status
    Operation:
      type: object
      additionalProperties: false
      properties:
        id: *id010
        kind:
          type: string
        state:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - PARTIALLY_SUCCEEDED
          - FAILED
          - NEEDS_RECONCILIATION
        progress:
          type: object
          additionalProperties: false
          properties:
            phase:
              type: string
            completed:
              type: integer
            total:
              type:
              - integer
              - 'null'
          required: []
        result_links:
          type: array
          items:
            type: string
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorResponse'
          - type: 'null'
        created_at: *id012
        deadline_at:
          type:
          - string
          - 'null'
      required:
      - id
      - kind
      - state
      - created_at
    ValidationRequest:
      type: object
      additionalProperties: false
      properties:
        target_connection_id: *id010
        expected_sha256:
          type: string
        parser_revision:
          type: integer
          minimum: 1
      required: []
    TableCreateRequest:
      type: object
      additionalProperties: false
      properties:
        upload_id: *id010
        confirmation_token:
          type: string
      required:
      - upload_id
      - confirmation_token
    DeployRequest:
      type: object
      additionalProperties: false
      properties:
        upload_id: *id010
        dag_ids:
          type: array
          items:
            type: string
        confirmation_token:
          type: string
        support_objects_acknowledged: *id011
      required:
      - upload_id
      - dag_ids
      - confirmation_token
      - support_objects_acknowledged
    AuthorizationRequest:
      type: object
      additionalProperties: false
      properties:
        revision_id: *id010
        physical_target_id:
          type: string
        scope:
          type: string
          enum:
          - ONCE
          - SCHEDULED
        allow_empty:
          type: boolean
          default: false
        allow_empty_acknowledged:
          type: boolean
          default: false
        confirmation_token:
          type: string
          minLength: 1
        acknowledged:
          type: boolean
          const: true
      required:
      - revision_id
      - physical_target_id
      - scope
      - allow_empty
      - acknowledged
      - confirmation_token
      allOf:
      - if:
          properties:
            allow_empty: {const: true}
          required: [allow_empty]
        then:
          properties:
            allow_empty_acknowledged: {const: true}
          required: [allow_empty_acknowledged]
    Authorization:
      type: object
      additionalProperties: false
      properties:
        id: *id010
        revision_id: *id010
        scope:
          type: string
          enum:
          - ONCE
          - SCHEDULED
        allow_empty: *id011
        acknowledged_at: *id012
        dag_id:
          type: string
        physical_target_id:
          type: string
        scope_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        schedule_sha256:
          type: [string, 'null']
        state:
          type: string
          enum: [GRANTED, RESERVED, CONSUMED, CLOSED, REVOKED, INVALIDATED]
        reserved_run_id:
          type: [string, 'null']
        reserved_intent_id:
          type: [string, 'null']
          format: uuid
        revision:
          type: integer
          minimum: 1
        allow_empty_acknowledged_at:
          type: [string, 'null']
          format: date-time
        consumed_at:
          type: [string, 'null']
          format: date-time
        closed_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        invalidated_at:
          type: [string, 'null']
          format: date-time
        replacement_in_progress:
          type: [boolean, 'null']
          description: null khi chưa xác minh; không suy false từ heartbeat cũ.
      required:
      - id
      - revision_id
      - scope
      - allow_empty
      - state
      - revision
      - dag_id
      - physical_target_id
      - scope_sha256
      - replacement_in_progress
    TriggerRequest:
      type: object
      additionalProperties: false
      properties:
        expected_revision:
          type: string
        confirmation_token:
          type: string
        authorization_id: *id010
      required:
      - expected_revision
      - confirmation_token
    DagStateRequest:
      type: object
      additionalProperties: false
      properties:
        is_paused: *id011
        expected_revision:
          type: string
        confirmation_token:
          type: string
        authorization_id: *id010
      required:
      - is_paused
      - expected_revision
      - confirmation_token
    Column:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        logical_type:
          type: string
        nullable: *id011
        ordinal:
          type: integer
          minimum: 1
        precision:
          type:
          - integer
          - 'null'
        scale:
          type:
          - integer
          - 'null'
        length:
          type: [integer, 'null']
          minimum: 1
        primary_key_ordinal:
          type: [integer, 'null']
          minimum: 1
        has_default:
          type: boolean
        default_literal:
          $ref: '#/components/schemas/TypedLiteral'
        description:
          type: [string, 'null']
      required:
      - name
      - logical_type
      - nullable
      - ordinal
      - has_default
      - primary_key_ordinal
      allOf:
      - if:
          properties:
            has_default: {const: true}
          required: [has_default]
        then:
          required: [default_literal]
    PreviewData:
      type: object
      additionalProperties: false
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/Column'
        rows:
          type: array
          items:
            type: array
            items:
              type:
              - string
              - number
              - integer
              - boolean
              - 'null'
        limited: *id011
        parser:
          $ref: '#/components/schemas/ParserConfig'
      required:
      - columns
      - rows
      - limited
      - parser
    DefinitionPreview:
      type: object
      additionalProperties: false
      properties:
        upload_id: *id010
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
              target:
                type: string
              ddl:
                type:
                - string
                - 'null'
              config:
                $ref: '#/components/schemas/ETLConfig'
              columns:
                type: array
                items:
                  $ref: '#/components/schemas/Column'
              warnings:
                type: array
                items:
                  type: string
              primary_key:
                type: array
                items: {type: string}
              table_name:
                type: string
              target_schema:
                type: string
              target_connection_revision_id:
                type: string
                format: uuid
              physical_target_id:
                type: string
              support_ddl:
                type: array
                items: {type: string}
              existing_table:
                type: [boolean, 'null']
            required:
            - id
            - target
            - warnings
            oneOf:
            - required: [config, support_ddl]
              not:
                required: [table_name]
            - required: [table_name, target_schema, target_connection_revision_id, physical_target_id, columns, primary_key, existing_table]
              not:
                required: [config]
        confirmation_token:
          type: string
        expires_at: *id012
        dependency_fingerprint:
          type: string
      required:
      - upload_id
      - items
      - confirmation_token
      - expires_at
    TableResult:
      type: object
      additionalProperties: false
      properties:
        table_id: *id010
        table_name:
          type: string
        state:
          type: string
          enum:
          - PENDING
          - CREATING
          - CREATED
          - ALREADY_EXISTS
          - FAILED
          - UNKNOWN
        ddl:
          type: string
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        error:
          anyOf:
          - $ref: '#/components/schemas/Issue'
          - type: 'null'
      required:
      - table_name
      - state
    TableCreationJob:
      type: object
      additionalProperties: false
      properties:
        id: *id010
        operation_id: *id010
        upload_id: *id010
        target_connection_revision_id: *id010
        state:
          type: string
        created_at: *id012
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        results:
          type: array
          items:
            $ref: '#/components/schemas/TableResult'
      required:
      - id
      - operation_id
      - results
    Deployment:
      type: object
      additionalProperties: false
      properties:
        id: *id010
        dag_id:
          type: string
        revision:
          type: string
        state:
          type: string
          enum:
          - VALIDATION_FAILED
          - READY_TO_DEPLOY
          - DEPLOYMENT_PENDING
          - DEPLOYED
          - DEPLOYMENT_FAILED
          - PARSE_ERROR
        reconcile_required: *id011
        airflow_version_id:
          type:
          - string
          - 'null'
        error_summary:
