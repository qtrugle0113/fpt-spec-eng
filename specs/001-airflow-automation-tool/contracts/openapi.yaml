openapi: 3.1.0
info:
  title: Hợp đồng Airflow Automation Tool
  version: 1.0.0
  description: Thiết kế trước implementation; quy tắc chi tiết ở rest-api.md và excel-definitions.md.
servers:
- url: http://localhost:8000/api/v1
- url: /api/v1
security: []
paths:
  /connections:
    get:
      operationId: get_connections
      summary: Danh sách connections
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionPage'
        default:
          description: Lỗi chuẩn hóa, không secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: search
        in: query
        schema:
          type: string
      - name: database_type
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 200
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
    post:
      operationId: post_connections
      summary: Tạo connection
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        default:
          description: Lỗi chuẩn hóa, không secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreate'
  /connections/{id}:
    get:
      operationId: get_connections_id
      summary: Chi tiết connection
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        default:
          description: Lỗi chuẩn hóa, không secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: patch_connections_id
      summary: Sửa connection theo revision
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        default:
          description: Lỗi chuẩn hóa, không secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionPatch'
    delete:
      operationId: delete_connections_id
      summary: Xóa connection không dependency
      responses:
        '204':
          description: Thành công
        default:
          description: Lỗi chuẩn hóa, không secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
  /connections/{id}/test:
    post:
      operationId: post_connections_id_test
      summary: Kiểm tra kết nối thật
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResult'
        default:
          description: Lỗi chuẩn hóa, không secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /files:
    get:
      operationId: get_files
      summary: Danh sách file
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePage'
        default:
          description: Lỗi chuẩn hóa, không secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 200
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
    post:
      operationId: post_files
      summary: Upload theo stream
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        default:
          description: Lỗi chuẩn hóa, không secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                parser_json:
                  type: string
                  description: JSON theo ParserConfig
              required:
              - file
              - parser_json
  /files/{id}:
    get:
      operationId: get_files_id
      summary: Thông tin file
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        default:
          description: Lỗi chuẩn hóa, không secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /files/{id}/preview:
    get:
      operationId: get_files_id_preview
