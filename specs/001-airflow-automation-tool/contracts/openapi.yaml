        resource_id: {type: string}
        label: {type: string}
        url: {type: string}
      required: [resource_type, resource_id, label]
    TypedLiteral:
      type: object
      additionalProperties: false
      properties:
        logical_type:
          type: string
          enum: [integer, bigint, decimal, varchar, text, boolean, date, timestamp]
        value:
          type: [string, integer, boolean, 'null']
          description: decimal/date/timestamp mã hóa bằng text lossless; không float.
      required: [logical_type, value]
      allOf:
      - if:
          properties:
            logical_type: {enum: [decimal, varchar, text, date, timestamp]}
          required: [logical_type]
        then:
          properties:
            value: {type: [string, 'null']}
      - if:
          properties:
            logical_type: {enum: [integer, bigint]}
          required: [logical_type]
        then:
          properties:
            value: {type: [integer, 'null']}
      - if:
          properties:
            logical_type: {const: boolean}
          required: [logical_type]
        then:
          properties:
            value: {type: [boolean, 'null']}
    ETLSource:
      type: object
      additionalProperties: false
      properties:
        type: {type: string, enum: [DB, CSV, TXT]}
        connection_revision_id: {type: string, format: uuid}
        schema: {type: string}
        table: {type: string}
        file_id: {type: string, format: uuid}
        parser_revision: {type: integer, minimum: 1}
        file_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
      required: [type]
      oneOf:
      - properties:
          type: {const: DB}
        required: [connection_revision_id, schema, table]
        not:
          anyOf:
          - required: [file_id]
          - required: [parser_revision]
          - required: [file_sha256]
      - properties:
          type: {enum: [CSV, TXT]}
        required: [file_id, parser_revision, file_sha256]
        not:
          anyOf:
          - required: [connection_revision_id]
          - required: [schema]
          - required: [table]
    ETLTarget:
      type: object
      additionalProperties: false
      properties:
        connection_revision_id: {type: string, format: uuid}
        schema: {type: string}
        table: {type: string}
        physical_target_id: {type: string}
      required: [connection_revision_id, schema, table, physical_target_id]
    ETLMapping:
      type: object
      additionalProperties: false
      properties:
        source_column: {type: [string, 'null']}
        target_column: {type: string}
        transformation: {type: string, enum: [DIRECT, CONSTANT, NULL_HANDLING, TYPE_CONVERSION]}
        default_literal:
          $ref: '#/components/schemas/TypedLiteral'
        enabled: {type: boolean}
      required: [target_column, transformation, enabled]
      allOf:
      - if:
          properties:
            transformation: {enum: [DIRECT, NULL_HANDLING, TYPE_CONVERSION]}
            enabled: {const: true}
          required: [transformation, enabled]
        then:
          properties:
            source_column: {type: string, minLength: 1}
          required: [source_column]
      - if:
          properties:
            transformation: {enum: [CONSTANT, NULL_HANDLING]}
            enabled: {const: true}
          required: [transformation, enabled]
        then:
          required: [default_literal]
    SourcePredicate:
      type: object
      additionalProperties: false
      properties:
        column: {type: string}
        operator: {type: string, enum: ['=', '!=', '<', '<=', '>', '>=', IN, IS NULL, IS NOT NULL]}
        value:
          oneOf:
          - $ref: '#/components/schemas/TypedLiteral'
          - type: array
            minItems: 1
            maxItems: 1000
            items:
              $ref: '#/components/schemas/TypedLiteral'
      required: [column, operator]
      allOf:
      - if:
          properties:
            operator: {enum: [IS NULL, IS NOT NULL]}
          required: [operator]
        then:
          not:
            required: [value]
        else:
          required: [value]
      - if:
          properties:
            operator: {const: IN}
          required: [operator]
        then:
          properties:
            value:
              type: array
              minItems: 1
              maxItems: 1000
              items:
                $ref: '#/components/schemas/TypedLiteral'
        else:
          properties:
            value:
              $ref: '#/components/schemas/TypedLiteral'
    ETLConfig:
      type: object
      additionalProperties: false
      properties:
        dag_id: {type: string, pattern: '^[A-Za-z0-9_.-]{1,200}$'}
        source:
          $ref: '#/components/schemas/ETLSource'
        target:
          $ref: '#/components/schemas/ETLTarget'
        schedule: {type: string}
        start_date: {type: [string, 'null'], format: date-time}
        timezone: {type: string}
        catchup: {type: boolean}
        is_paused: {type: boolean}
        load_strategy: {type: string, enum: [APPEND, UPSERT, FULL_REFRESH]}
        conflict_keys:
          type: array
          items: {type: string}
        batch_size: {type: integer, minimum: 1, maximum: 10000, default: 1000}
        retry_count: {type: integer, minimum: 0, maximum: 10, default: 0}
        retry_delay: {type: integer, minimum: 0, maximum: 3600, default: 60}
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/ETLMapping'
        filter:
          type: object
          additionalProperties: false
          properties:
            and:
              type: array
              minItems: 1
              maxItems: 20
              items:
                $ref: '#/components/schemas/SourcePredicate'
          required: [and]
      required: [dag_id, source, target, schedule, timezone, catchup, is_paused, load_strategy, conflict_keys, batch_size, retry_count, retry_delay, mappings]
      allOf:
      - if:
          properties:
            load_strategy: {const: UPSERT}
          required: [load_strategy]
        then:
          properties:
            conflict_keys: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        else:
          properties:
            conflict_keys: {type: array, maxItems: 0}
      - if:
          properties:
            schedule: {const: Manual}
          required: [schedule]
        else:
          properties:
            start_date: {type: string, format: date-time}
          required: [start_date]
      - if:
          properties:
            source:
              properties:
                type: {enum: [CSV, TXT]}
              required: [type]
          required: [source]
        then:
          not:
            required: [filter]
