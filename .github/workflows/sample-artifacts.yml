name: Kiểm chứng bytes artifact mẫu
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sample-bytes:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ghi commit thực được checkout
        run: git rev-parse HEAD
      - name: Kiểm raw LF, SHA256 và workbook bytes sau checkout
        run: python -m unittest tests.unit.test_sample_artifacts -v
      - name: Kiểm lock image khớp FROM và hồi quy lệch pin
        run: python -m unittest tests.unit.test_image_baseline tests.unit.test_airflow_constraints tests.unit.test_airflow_offline_patch tests.integration.test_image_compatibility.ImageCompatibilityTests.test_source_pins_match_image_lock -v
      - name: Xác nhận kiểm thử không sửa artifact
        run: git diff --exit-code -- samples templates
      - name: Kiểm approval nghiệm thu, giới hạn scope và thời hạn UTC+09
        run: python -m unittest tests.unit.test_full_handover_policy -v
      - name: Đối chiếu hồ sơ đã duyệt và raw reports trên checkout thật
        run: python -m tests.tools.full_handover_policy
      - name: Kiểm ma trận T152 và từ chối bằng chứng không đúng ca bắt buộc
        run: python -m unittest tests.unit.test_t152_evidence -v
      - name: Đối chiếu A–AM, SC, US, BR-08 và checksum log/receipt
        run: python -m tests.tools.t152_evidence
